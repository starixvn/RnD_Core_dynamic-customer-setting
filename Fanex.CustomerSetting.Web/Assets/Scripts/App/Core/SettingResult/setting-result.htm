<div class="result-container" data-ng-show="result">
    <div class="result" data-ng-show="!result.subResults" data-ng-class="result.msgType">
        <div class="message-icon"></div>
        <div class="content" data-ng-bind="result.message"></div>
    </div>
    <div class="result" data-ng-show="result.subResults" data-ng-repeat="subResult in result.subResults" data-ng-class="subResult.msgType">
        <div class="message-icon"></div>
        <div class="content" data-ng-bind="subResult.message"></div>
    </div>
</div>
