<div class="block default-setting-block" data-ng-show="settingType">
    <div class="header" data-ng-attr-setting-type="{{settingType.id}}">
        {{settingType.name}}
        <div class="update">
            <span class="icon update-icon"
                  data-ng-attr-title="{{'Update' | label}}"
                  data-ng-click="update({settingTypeId: settingType.id})"></span>
        </div>
    </div>
    <div class="header sport-group-header"
         data-ng-show="settingType.settingLevel===settingLevel.sportTypeBetType && settingType.settingItems.length > 0"
         data-ng-attr-sport-type="settingItem.sportTypeId">{{settingType.settingItems[0].sportTypeName}}</div>
    <div class="name-col"></div>
    <div class="name-col"
         data-ng-repeat="settingItem in settingType.settingItems"
         data-ng-class="{'last':$last}"
         data-ng-attr-sport-type="settingItem.sportTypeId"
         data-ng-attr-sport-type="settingItem.betTypeId">
        {{settingType.settingLevel===settingLevel.product ? productName : (settingType.settingLevel===settingLevel.sportType ? settingItem.sportTypeName : settingItem.betTypeName)}}
    </div>
</div>
