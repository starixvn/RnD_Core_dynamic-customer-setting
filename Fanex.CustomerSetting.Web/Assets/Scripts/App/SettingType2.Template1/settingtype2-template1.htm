<div>
    <default-setting-type-grouping class="setting-type-2"></default-setting-type-grouping>
    <script type="text/ng-template" id="settingtyp2-template1-header.html">
        <div class="empty-cell"></div>
        <div class="w80-percent">
            <div class="w33-percent">{{::('MinBet' | label)}}</div>
            <div class="w33-percent">{{::('MaxBet' | label)}}</div>
            <div class="w33-percent last">{{::('MaxPerMatch' | label)}}</div>
        </div>
    </script>
    <script type="text/ng-template" id="settingtyp2-template1-value.html">
        <div data-ng-if="customerLevel === avaiCustomerLevels.member && uplineLevel !== avaiCustomerLevels.agent">
            <div class="w33-percent align-center">{{item.minBet}}</div>
            <div class="w33-percent align-center">{{item.maxBet}}</div>
            <div class="w33-percent last align-center">{{item.maxPerMatch}}</div>
        </div>
        <input type="hidden" value="{{uplineLevel}}" />
        <input type="hidden" value="{{avaiCustomerLevels.agent}}" />
        <div data-ng-if="customerLevel !== avaiCustomerLevels.member || uplineLevel === avaiCustomerLevels.agent">
            <bet-setting-input class="w33-percent"
                               data-setting-item="item"
                               data-upline-level="uplineLevel"
                               data-customer-level="customerLevel"
                               data-field-name="'minBet'"></bet-setting-input>
            <bet-setting-input class="w33-percent"
                               data-setting-item="item"
                               data-upline-level="uplineLevel"
                               data-customer-level="customerLevel"
                               data-field-name="'maxBet'"></bet-setting-input>
            <bet-setting-input class="w33-percent last"
                               data-setting-item="item"
                               data-upline-level="uplineLevel"
                               data-customer-level="customerLevel"
                               data-field-name="'maxPerMatch'"></bet-setting-input>
        </div>
    </script>
    <script type="text/ng-template" id="bet-setting-input.html">
        <div>
            <input type="text"
                   maxlength="14"
                   class="number" />
        </div>
    </script>
</div>
