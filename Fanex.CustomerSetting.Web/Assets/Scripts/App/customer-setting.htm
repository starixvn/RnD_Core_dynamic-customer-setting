<!DOCTYPE html>
<html data-ng-app="customer-setting" data-ng-controller="CustomerSettingController as ctrl">
<head>
    <meta charset="utf-8" />
    <title data-ng-bind="'CustomerSetting' | resourceTranslation"></title>
    <link rel="stylesheet" type="text/css" href="{{rootUrl}}/app/customerSetting/customer-setting.min.css?v={{version}}" />
</head>
<body data-ng-cloak>
    <div data-customer-setting>
        <div data-response-message></div>
        <div data-ng-show="ctrl.query.customerNames">
            <div class="header">{{ctrl.query.customerNames}}</div>
        </div>
        <div data-customer-info></div>
    </div>
    <div data-block-ui></div>
    <script type="text/javascript" src="{{rootUrl}}/scripts/libraries/angularjs/angular.min.js?v={{version}}"></script>
    <script type="text/javascript" src="{{rootUrl}}/app/customersetting/customer-setting{{min}}.js?v={{version}}"></script>
</body>
</html>
