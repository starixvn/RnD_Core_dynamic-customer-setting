<div>
    <default-setting-type-block data-product-id="productId"
                                data-product-name="productName"
                                data-setting-type="settingType"
                                data-update="update({ settingTypeId: settingTypeId })"
                                data-value-template-url="valueTemplateUrl">
    </default-setting-type-block>
    <script type="text/ng-template" id="settingtyp4-template1-value.html">
        <status-checkbox data-setting-item="item"></status-checkbox>
    </script>
    <script type="text/ng-template" id="status-checkbox.html">
        <label class="status-checkbox">
            <input type="checkbox"
                   data-ng-model="isChecked"
                   data-ng-disabled="!isEnabled"
                   data-ng-change="change()" />
            {{'Enable' | label}}
        </label>
        <label class="status-checkbox">
            <input type="checkbox"
                   data-ng-model="isDownlineChecked"
                   data-ng-disabled="!isDownlineEnabled"
                   data-ng-change="changeDownline()" />
            {{'EnableDownline' | label}}
        </label>
    </script>
</div>
