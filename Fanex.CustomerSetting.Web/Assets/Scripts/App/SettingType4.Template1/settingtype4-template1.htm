<div>
    <default-setting-type-grouping></default-setting-type-grouping>
    <script type="text/ng-template" id="settingtyp4-template1-value.html">
        <status-checkbox data-setting-item="item"
                         data-customer-level="customerLevel"
                         data-avai-customer-levels="avaiCustomerLevels">
        </status-checkbox>
    </script>
    <script type="text/ng-template" id="status-checkbox.html">
        <div>
            <label class="checkbox">
                <input type="checkbox"
                       data-ng-model="isChecked"
                       data-ng-disabled="isDisabled"
                       data-ng-change="change()" />
                {{'Enable' | productStatusLabel}}
            </label>
            <label class="checkbox" data-ng-show="customerLevel > avaiCustomerLevels.member">
                <input type="checkbox"
                       data-tooltip
                       data-message="settingItem.validationState.message | productStatusMessage"
                       data-ng-model="isDownlineChecked"
                       data-ng-disabled="isDownlineDisabled"
                       data-ng-change="changeDownline()" />
                {{'EnableDownline' | productStatusLabel}}
            </label>
        </div>
    </script>
</div>
