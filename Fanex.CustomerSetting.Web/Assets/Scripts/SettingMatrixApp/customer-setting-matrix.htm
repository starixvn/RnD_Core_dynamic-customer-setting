<!DOCTYPE html>
<html data-ng-app="customerSettingMatrix">
<head>
    <meta charset="utf-8" />
    <title></title>
    <link rel="stylesheet" type="text/css" href="{{rootUrl}}app/CustomerSettingMatrix/styles/customer-setting-matrix.min.css?v={{version}}" />
</head>
<body data-ng-cloak data-ng-controller="customerSettingMatrixController as ctrl">

    <div class="header-container">
        <ul class="navigation">
            <li data-ng-repeat="settingType in ctrl.settingTypes" data-ng-click="activeNavigationItem(navigationItem)" data-ng-class="{'active': selectedNavigationItem==navigationItem}">
                <a href="#">{{settingType.name}}</a>
            </li>
        </ul>
    </div>
    
    <div class="form-container">
        <div class="controls">
            <label for="product">
                Product
            </label>
            <select name="product" data-ng-model="ctrl.productName" data-ng-options="product.name for product in ctrl.productNames"></select>
        </div>
        <div class="controls">
            <label for="userName">
                Username
            </label>
            <input name="userName" type="text" data-ng-model="ctrl.customerName" />

        </div>
        <div class="controls">
            <button data-ng-click="ctrl.querySettingMatrix()">
                Submit
            </button>
        </div>
    </div>

    <div class="message-container" data-ng-show="message" data-ng-bind="message">
    </div>

    <div data-ng-show="ctrl.customerLine.length > 0" customer-line="ctrl.customerLine" data-customer-line-directive>
    </div>

    <div class="result-container" data-ng-show="settings" data-ng-switch="selectedNavigationItem.Value">
        <div data-ng-switch-when="0" data-fanex-position-taking-matrix>
        </div>
        <div data-ng-switch-when="1" data-fanex-commission-matrix>
        </div>
    </div>

    <block-ui data-is-loading="ctrl.isUIblocked"></block-ui>
    <script type="text/javascript">
        var appConfig = {{appConfig}};
    </script>
    <script type="text/javascript" src="{{rootUrl}}scripts/libraries/angularjs/angular.min.js?v={{version}}"></script>
    <script type="text/javascript" src="{{rootUrl}}app/customersettingmatrix/customer-setting-matrix{{min}}.js?v={{version}}"></script>
</body>
</html>
