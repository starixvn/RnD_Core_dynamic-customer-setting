<div class="group" data-ng-repeat="commissionItemMatrix in commissionMatrix.commissionItemMatrices">
    <div data-ng-show="table.Name" class="group-name">
        {{commissionItemMatrix.sportType}}
    </div>
    <div class="table">
        <table>
            <colgroup>
                <col width="80" />
                <col width="50"/>
            </colgroup>
            <thead>
                <tr>
                    <th>
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr data-ng-repeat="customerLevel in commissionMatrix.customerLevels">
                    <td>
                        {{customerLevel.displayName}} ({{customerLevel.value}})
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
