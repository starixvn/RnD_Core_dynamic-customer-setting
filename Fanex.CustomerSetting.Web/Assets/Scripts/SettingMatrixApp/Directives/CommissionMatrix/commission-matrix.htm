<div class="group-matrix" data-ng-repeat="commissionItemMatrixGroup in commissionMatrix.commissionItemMatrixGroups">
    <div data-ng-show="commissionItemMatrixGroup.name" class="group-name">
        {{::commissionItemMatrixGroup.name}}
    </div>
    <div class="item-matrix">
        <table>
            <colgroup>
                <col width="80" />
                <col width="120" data-ng-repeat="commissionItemMatrix in commissionItemMatrixGroup.commissionItemMatrices" />
            </colgroup>
            <thead>
                <tr>
                    <th>
                    </th>
                    <th data-ng-repeat="commissionItemMatrix in commissionItemMatrixGroup.commissionItemMatrices">
                        {{commissionItemMatrix.getHeaderName(commissionItemMatrixGroup.settingLevel)}}
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr data-ng-repeat="customerLevel in commissionMatrix.customerLevels">
                    <td class="customer-level">
                        {{::customerLevel.displayName}} ({{::customerLevel.value}})
                    </td>
                    <td data-ng-repeat="commissionItemMatrix in commissionItemMatrixGroup.commissionItemMatrices">
                        {{commissionItemMatrix.commissionItemMatrixRows[$parent.$index].commRate | number: 4}}
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
