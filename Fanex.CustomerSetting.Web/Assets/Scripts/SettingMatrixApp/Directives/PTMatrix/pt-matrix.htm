<div class="group" data-ng-repeat="ptItemMatrix in ptMatrix.ptItemMatrices">
    <div class="group-name">
        {{ptItemMatrix.sportName}} 
    </div>
    <div class="table">
        <div class="table-name">
            {{ptItemMatrix.betTypeName}}
        </div>
        <table>
            <colgroup>
                <col width="80" />
                <col width="50" />
                <col width="50" />
                <col width="50" />
                <col width="50" />
                <col width="50" />
                <col width="50" />
                <col width="50" />
                <col width="50" />
            </colgroup>
            <thead>
                <tr>
                    <th>
                    </th>
                    <th>
                        Super
                    </th>
                    <th>
                        Master
                    </th>
                    <th>
                        Agent
                    </th>
                    <th>
                        US
                    </th>
                    <th>
                        IS
                    </th>
                    <th>
                        UM
                    </th>
                    <th>
                        IM
                    </th>
                    <th>
                        N
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr data-ng-repeat="ptItemMatrixRow in ptItemMatrix.ptItemMatrixRows">
                    <td>
                        {{ptItemMatrixRow.customerLevel}}
                    </td>
                    <td>
                        {{ptItemMatrixRow.superPT}}
                    </td>
                    <td>
                        {{ptItemMatrixRow.masterPT}}
                    </td>
                    <td>
                        {{ptItemMatrixRow.agentPT}}
                    </td>
                    <td>
                        {{ptItemMatrixRow.autoSuperPT}}
                    </td>
                    <td data-ng-switch="ptItemMatrixRow.isAutoSuperPT !== undefined">
                        <input data-ng-switch-when="true" type="checkbox" value="ptItemMatrixRow.isAutoSuperPT" disabled="disabled" />
                    </td>
                    <td data-ng-switch="ptItemMatrixRow.customerLevel=='Master' && ptMatrix.isAllowMasterAutoPT">
                        <div data-ng-switch-when="true">
                            <div class="icon-auto-pt">
                            </div>
                        </div>
                        <div data-ng-switch-when="false">
                            {{ptItemMatrixRow.autoMasterPT}}
                        </div>
                    </td>
                    <td data-ng-switch="ptItemMatrixRow.customerLevel==3 && ptMatrix.isAllowMasterAutoPT"
                        data-ng-class="{'auto-pt': ptItemMatrixRow.customerLevel==3 && ptMatrix.isAllowMasterAutoPT}">
                        <div data-ng-switch-when="false">
                            <div data-ng-switch="ptItemMatrixRow.isAutoMasterPT !== undefined">
                                <input data-ng-switch-when="true" type="checkbox" value="ptItemMatrixRow.isAutoMasterPT" disabled="disabled" />
                            </div>
                        </div>
                    </td>
                    <td>
                        {{ptItemMatrixRow.minPT}}
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
