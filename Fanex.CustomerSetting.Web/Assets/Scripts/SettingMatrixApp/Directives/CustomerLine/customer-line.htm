<div class="breadcrumb-container">
    <ol>
        <li data-ng-repeat="customer in customerLine" data-ng-switch="$last" data-ng-class="{'active': $last}">
            <a href="#" ng-switch-when="false" data-ng-click="selectUserName(customer.name)">
                {{customer.name}}
                ({{customer.id}})
            </a> <span ng-switch-when="true">{{customer.name}} ({{customer.id}})</span>
        </li>
    </ol>
</div>
