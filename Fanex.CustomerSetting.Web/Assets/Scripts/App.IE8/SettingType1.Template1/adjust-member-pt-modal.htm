<div class="modal-overlay" data-ng-show="isShown">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title">{{'UpdateMemberPtInfo' | positionTakingLabel}}</div>
        </div>
        <div class="modal-content">
            <span data-ng-bind-html="'UpdateMemberPtQuestion' | positionTakingLabel | unsafe"></span>
            <select data-ng-model="selectedValue"
                    data-ng-options="item.key as item.value / divisor for item in range"></select>
        </div>
        <div class="modal-footer">
            <button data-ng-click="ok()">{{'Yes' | label}}</button>
            <button data-ng-click="cancel()">{{'No' | label}}</button>
        </div>
    </div>
</div>
