<div class="align-center" data-ng-if="customerLevel === avaiCustomerLevels.member && uplineLevel !== avaiCustomerLevels.agent">
    <div class="w33-percent">{{item.minBet}}</div>
    <div class="w33-percent">{{item.maxBet}}</div>
    <div class="w33-percent last">{{item.maxPerMatch}}</div>
</div>
<div data-ng-if="customerLevel !== avaiCustomerLevels.member || uplineLevel === avaiCustomerLevels.agent">
    <div class="w33-percent"
         data-bet-setting-input
         data-setting-item="item"
         data-upline-level="uplineLevel"
         data-customer-level="customerLevel"
         data-field-name="minBet">
    </div>
    <div class="w33-percent"
         data-bet-setting-input
         data-setting-item="item"
         data-upline-level="uplineLevel"
         data-customer-level="customerLevel"
         data-field-name="maxBet">
    </div>
    <div class="w33-percent last"
         data-bet-setting-input
         data-setting-item="item"
         data-upline-level="uplineLevel"
         data-customer-level="customerLevel"
         data-field-name="maxPerMatch">
    </div>
</div>
