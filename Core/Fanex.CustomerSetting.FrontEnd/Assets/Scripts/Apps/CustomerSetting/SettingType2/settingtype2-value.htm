<div class="block__cell-group" data-ng-if="settingType | editableSettingType">
    <bet-setting-input class="block__cell w33-percent setting-field-wrapper"
                       data-setting-item="item"
                       data-upline-level="uplineLevel"
                       data-customer-level="customerLevel"
                       data-field-name="minBet">
    </bet-setting-input>
    <bet-setting-input class="block__cell w33-percent setting-field-wrapper"
                       data-setting-item="item"
                       data-upline-level="uplineLevel"
                       data-customer-level="customerLevel"
                       data-field-name="maxBet">
    </bet-setting-input>
    <bet-setting-input class="block__cell block__cell--no-border w33-percent w33-percent--last setting-field-wrapper"
                       data-setting-item="item"
                       data-upline-level="uplineLevel"
                       data-customer-level="customerLevel"
                       data-field-name="maxPerMatch">
    </bet-setting-input>
</div>
<div class="block__cell-group" data-ng-if="!(settingType | editableSettingType)">
    <div class="block__cell w33-percent align-center">{{item.minBet | formatNumber}}</div>
    <div class="block__cell w33-percent align-center">{{item.maxBet | formatNumber}}</div>
    <div class="block__cell block__cell--no-border w33-percent w33-percent--last align-center">{{item.maxPerMatch | formatNumber}}</div>
</div>
