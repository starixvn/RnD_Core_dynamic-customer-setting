<div class="modal-overlay" data-ng-show="isShown">
    <div class="modal" data-draggable="'.modal__title'">
        <div class="modal__title">
            <div data-ng-if="customerLevel === avaiCustomerLevels.master">
                {{'DisableMasterAutoPt' | positionTakingLabel}}
            </div>
            <div data-ng-if="customerLevel === avaiCustomerLevels.agent">
                {{'DisableAgentAutoPt' | positionTakingLabel}}
            </div>
        </div>
        <div class="modal__content" data-detect-max-height>
            <div class="question-block" data-ng-bind-html="'UpdateMemberPtQuestion' | positionTakingLabel | unsafe"></div>
            <div class="block full-width">
                <div class="block__item-group" data-ng-repeat="group in sportGroups">
                    <div class="block__sub-header"
                         data-ng-if="settingLevel === avaiSettingLevels.sportTypeBetType"
                         data-ng-class="{ 'block__sub-header--border-top': ($index > 0) }"
                         data-sport-type="{{group[0].sportTypeId}}">
                        {{group[0].sportTypeName}}
                        <copy-position-taking-on-member data-ng-if="sportGroups.length > 1 && $index === 0"
                                                        data-customer-level="customerLevel"
                                                        data-setting-type-id="settingTypeId"
                                                        data-setting-items="sportGroups">
                        </copy-position-taking-on-member>
                    </div>
                    <div class="block__item"
                         data-ng-repeat="item in group"
                         data-ng-class="{ 'block__item--last': $last }">
                        <div class="block__lbl block__lbl--half-width"
                             data-sport-type="{{item.sportTypeId}}"
                             data-bet-type="{{item.betTypeId}}">
                            {{item | showingName:settingLevel:productName }}
                            {{item.isLive ? '(' + ('Live' | label) + ')' : ''}}
                            <copy-position-taking-on-member data-ng-if="group.length > 1 && $index === 0"
                                                            data-customer-level="customerLevel"
                                                            data-setting-type-id="settingTypeId"
                                                            data-setting-items="group">
                            </copy-position-taking-on-member>
                        </div>
                        <div class="block__value block__value--half-width">
                            <div class="setting-field-wrapper">
                                <select class="setting-field"
                                        data-ng-if="customerLevel === avaiCustomerLevels.master"
                                        data-ng-model="item.superPTOnMembers"
                                        data-field-highlighting
                                        data-field-name="'superPTOnMembers'"
                                        data-highlight-state="item.highlightState"
                                        data-ng-options="item.key as (item.value | ptFormat) for item in ranges[$index]"></select>
                                <select class="setting-field"
                                        data-ng-if="customerLevel === avaiCustomerLevels.agent"
                                        data-ng-model="item.masterPTOnMembers"
                                        data-field-highlighting
                                        data-field-name="'masterPTOnMembers'"
                                        data-highlight-state="item.highlightState"
                                        data-ng-options="item.key as (item.value | ptFormat) for item in ranges[$index]"></select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal__footer">
            <button class="btn btn--small" data-ng-click="ok()">{{'Yes' | label}}</button>
            <button class="btn btn--small" data-ng-click="cancel()">{{'No' | label}}</button>
        </div>
    </div>
</div>
