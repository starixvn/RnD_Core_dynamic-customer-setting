<div class="block" data-ng-show="settingType" data-ng-class="{ 'block--error': !(settingType | validSettingType) }">
    <div class="block__header"
         data-setting-type="{{settingType.id}}"
         data-ng-class="{ 'block__header--error': !(settingType | validSettingType) }">
        <toggle-setting-block data-ng-if="togglableSharedStates"
                              data-shared-states="togglableSharedStates"
                              data-setting-type-id="settingType.id">
        </toggle-setting-block>
        {{settingTypeName}}
        <div class="right-btn-area right-btn-area--seperate"
             title="{{'Update' | label}}"
             data-ng-if="(settingType | editableSettingType) && (settingType | validSettingType) && normalMode"
             data-ng-click="update({ settingTypeId: settingType.id })">
            <span class="icon icon--update"></span>
        </div>
    </div>
    <div class="block__item-group" data-ng-if="settingType | validSettingType" data-ng-repeat="group in sportGroups">
        <div class="block__sub-header"
             data-ng-if="settingType.settingLevel === avaiSettingLevels.sportTypeBetType"
             data-ng-class="{ 'block__sub-header--border-top': ($index > 0),
                              'indent-30': togglableSharedStates,
                              'block__sub-header--no-border-bottom': togglableSharedStates && !togglableSharedStates.toggleStates[$index] }"
             data-sport-type="{{group[0].sportTypeId}}">
            <toggle-setting-block data-ng-if="togglableSharedStates"
                                  data-shared-states="togglableSharedStates"
                                  data-block-index="$index"
                                  data-setting-data="group"
                                  data-setting-type-id="settingType.id">
            </toggle-setting-block>
            {{group[0].sportTypeName}}
            <note-icon-tooltip data-ng-if="group[0].showIconTooltipMessage"
                               data-tooltip-message
                               data-tooltip-message-backup="{{group[0].tooltipMessage}}"
                               data-tooltip-type />
            <copy-setting data-ng-if="(settingType | editableSettingType) && sportGroups.length > 1 && $index === 0"
                          data-setting-type-id="settingType.id"
                          data-setting-items="sportGroups">
            </copy-setting>
        </div>
        <div class="block__lbl-group"
             data-ng-include="headerTemplateUrl"
             data-ng-hide="togglableSharedStates && !togglableSharedStates.toggleStates[$index]">
        </div>
        <div class="block__item"
             data-ng-repeat="item in group"
             data-ng-hide="togglableSharedStates && !togglableSharedStates.toggleStates[$parent.$index]"
             data-ng-class="{ 'block__item--before-extra-item': $last && group.length % 2 === 1 && group.length > 1,
                              'block__item--last': $last,
                              'block__item--near-last': $index === group.length - 2 && $index % 2 === 0,
                              'block__item--odd': $odd,
                              'block__item--full-width': group.length === 1 }">
            <div class="block__lbl"
                 data-product="{{productId}}"
                 data-sport-type="{{item.sportTypeId}}"
                 data-bet-type="{{item.betTypeId}}">
                <span class="showing-name">{{item | showingName:settingType.settingLevel:productName }}{{item.isLive ? '(' + ('Live' | label) + ')' : ''}}</span>
                <copy-setting data-ng-if="(settingType | editableSettingType) && group.length > 1 && $index === 0"
                              data-setting-type-id="settingType.id"
                              data-setting-items="group">
                </copy-setting>
            </div>
            <div class="block__value" data-ng-include="valueTemplateUrl"></div>
        </div>
        <div class="block__item block__item--last block__item--extra"
             data-ng-if="group.length % 2 === 1 && group.length > 1"
             data-ng-hide="togglableSharedStates && !togglableSharedStates.toggleStates[$index]">
            <div class="block__lbl"></div>
            <div class="block__value"></div>
        </div>
    </div>
    <div class="block__item block__item--error" data-ng-if="!(settingType | validSettingType)">
        {{sportGroups[0][0].errorMessage}}
    </div>
</div>
