<div class="right-btn-area"
     title="{{(isExpanded ? 'Collapse' : 'Collapse') | label}}"
     data-ng-class="{ 'right-btn-area--seperate': blockIndex === null || blockIndex === undefined }"
     data-ng-click="toggle()">
    <span class="icon"
          data-ng-class="{ 'icon--collapse': isExpanded, 'icon--expand': !isExpanded }"></span>
</div>
