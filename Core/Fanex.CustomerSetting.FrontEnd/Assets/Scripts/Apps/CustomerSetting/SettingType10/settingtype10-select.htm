<div class="setting-field-wrapper">
    <select class="setting-field"
            data-field-highlighting
            data-field-name="rate"
            data-highlight-state="dataSource.highlightState"
            data-tooltip-message="{{dataSource.validationState | tooltipMessage:'settingType10ResourceService'}}"
            data-ng-model="dataSource.rate"
            data-ng-options="item.value as item.key for item in range"></select>
</div>
