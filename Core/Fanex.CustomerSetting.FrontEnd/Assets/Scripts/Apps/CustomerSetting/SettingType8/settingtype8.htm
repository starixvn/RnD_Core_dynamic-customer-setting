<div class="block settingtype8" data-ng-show="settingType" data-ng-class="{ 'block--error': !(settingType | validSettingType) }">
    <div class="block__header"
         data-setting-type="{{settingType.id}}"
         data-ng-class="{ 'block__header--error': !(settingType | validSettingType) }">
        {{settingTypeName}}
        <div class="right-btn-area right-btn-area--seperate"
             title="{{'Update' | label}}"
             data-ng-if="(settingType | editableSettingType) && (settingType | validSettingType) && normalMode"
             data-ng-click="update({ settingTypeId: settingType.id })">
            <span class="icon icon--update"></span>
        </div>
    </div>
    <div class="block__item-group"
         data-ng-if="settingType | validSettingType"
         data-ng-repeat="item in settingType.settingItems">
        <div class="col w20-percent"
             data-ng-class="{ 'col--border-top': ($index > 0) }">
            <div class="block__sub-header">
                <label class="check-all-field-lbl"
                       data-ng-if="settingType.settingLevel === avaiSettingLevels.sportType">
                    {{item.sportTypeName}}
                </label>
                <label class="check-all-field-lbl"
                       data-ng-if="settingType.settingLevel === avaiSettingLevels.product">
                    {{productName}}
                </label>
                <setting-type8-checkbox-group data-ng-if="(settingType | editableSettingType) && (customerLevel !== avaiCustomerLevels.member)"
                                              data-items="item.levelGroups" />
            </div>
            <div class="block__cell"
                 data-ng-repeat="stakeLevelDetailedItem in item.stakeLevelDetailedItems"
                 data-ng-class="{ 'block__cell--no-border-bottom': $last }">
                {{stakeLevelDetailedItem.betTypeName }}
            </div>
        </div>
        <div class="col scrollable-area w80-percent"
             data-ng-class="{ 'col--border-top': ($index > 0) }">
            <div class="col"
                 data-ng-repeat="levelGroup in item.levelGroups"
                 data-ng-class="{ 'col--last': $last }"
                 data-ng-style="levelGroup.getStyles()">
                <div class="block__sub-header">
                    <div class="setting-field--checkfield">
                        <input id="{{levelGroup.levelId}}"
                               type="checkbox"
                               class="setting-field--checkfield__check-ctrl"
                               data-ng-model="levelGroup.selected"
                               data-ng-disabled="!(settingType | editableSettingType)"
                               data-ng-if="customerLevel !== avaiCustomerLevels.member">
                        <input id="{{levelGroup.levelId}}"
                               type="radio"
                               class="setting-field--checkfield__check-ctrl"
                               data-ng-model="item.selectedLevelId"
                               data-ng-value="levelGroup.levelId"
                               data-ng-disabled="!(settingType | editableSettingType)"
                               data-ng-if="customerLevel === avaiCustomerLevels.member">
                        <label class="setting-field--checkfield__check-ctrl-lbl" for="{{levelGroup.levelId}}">{{levelGroup.levelGroupName}}</label>
                    </div>
                </div>
                <div class="block__cell"
                     data-ng-class="{ 'block__cell--no-border-bottom': $last }"
                     data-ng-repeat="stakeLevelDetailedItem in item.stakeLevelDetailedItems">
                    {{stakeLevelDetailedItem.stakeRanges[$index].value}}
                </div>
            </div>
        </div>
    </div>
    <div class="block__item block__item--error" data-ng-if="!(settingType | validSettingType)">
        {{settingType.settingItems[0].errorMessage}}
    </div>
</div>
