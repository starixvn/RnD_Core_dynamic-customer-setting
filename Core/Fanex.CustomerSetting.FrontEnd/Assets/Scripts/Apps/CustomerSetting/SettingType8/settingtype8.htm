<div class="block settingtype8" data-ng-show="settingType" data-ng-class="{ 'block--error': !(settingType | validSettingType) }">
    <div class="block__header"
         data-setting-type="{{settingType.id}}"
         data-ng-if="!popupMode"
         data-ng-class="{ 'block__header--error': !(settingType | validSettingType) }">
        {{::('BetLimit' | settingType8Label)}}
        <div class="right-btn-area right-btn-area--seperate"
             title="{{'Update' | label}}"
             data-ng-if="(settingType | editableSettingType) && (settingType | validSettingType) && normalMode"
             data-ng-click="update({ settingTypeId: settingType.id })">
            <span class="icon icon--update"></span>
        </div>
    </div>
    <div class="block__item-group"
         data-ng-if="settingType | validSettingType"
         data-ng-repeat="item in settingType.settingItems">
        <div class="col col--lbl w20-percent"
             data-ng-class="{ 'col--border-top': ($index > 0) }">
            <div class="block__sub-header">
                <label class="check-all-field-lbl"
                       data-ng-if="settingType.settingLevel === avaiSettingLevels.sportType">
                    {{item.sportTypeName}}
                </label>
                <label class="check-all-field-lbl"
                       data-ng-if="settingType.settingLevel === avaiSettingLevels.product">
                    {{productName}}
                </label>
                <setting-type8-checkbox-group data-ng-if="(settingType | editableSettingType) && (customerLevel !== avaiCustomerLevels.member) && !popupMode"
                                              data-items="item.groups" />
            </div>
            <div class="block__cell"
                 data-ng-repeat="detail in item.details"
                 data-ng-class="{ 'block__cell--no-border-bottom': $last && !item.hasMoreDetails }">
                {{detail.betTypeName }}
            </div>
            <div class="block__cell block__cell--no-border-bottom" data-ng-if="item.hasMoreDetails">
                <a href="javascript:void(0);" data-ng-click="getLevelGroupDetails(item)">
                    {{::('ViewMore' | settingType8Label)}}
                </a>
            </div>
        </div>
        <div class="col col--border-left scrollable-area w80-percent"
             data-ng-class="{ 'col--border-top': ($index > 0) }">
            <div class="col"
                 data-ng-repeat="group in item.groups"
                 data-ng-class="{ 'col--last': $last }"
                 data-ng-style="item.styles">
                <div class="block__sub-header">
                    <div class="setting-field--checkfield">
                        <input id="{{group.levelId}}"
                               type="checkbox"
                               class="setting-field--checkfield__check-ctrl"
                               data-ng-model="group.selected"
                               data-ng-disabled="!(settingType | editableSettingType)"
                               data-ng-if="customerLevel !== avaiCustomerLevels.member && !popupMode">
                        <input id="{{group.levelId}}"
                               type="radio"
                               class="setting-field--checkfield__check-ctrl"
                               data-ng-model="item.selectedLevelId"
                               data-ng-value="group.levelId"
                               data-ng-disabled="!(settingType | editableSettingType)"
                               data-ng-if="customerLevel === avaiCustomerLevels.member && !popupMode">
                        <label class="setting-field--checkfield__check-ctrl-lbl" for="{{group.levelId}}">
                            {{group.levelGroupName}}
                        </label>
                    </div>
                </div>
                <div class="block__cell"
                     data-ng-class="{ 'block__cell--no-border-bottom': $last && !item.hasMoreDetails }"
                     data-ng-repeat="detail in item.details">
                    {{detail.stakeRanges[$parent.$index].value}}
                </div>
                <div class="block__cell block__cell--no-border-bottom" data-ng-if="item.hasMoreDetails"></div>
            </div>
        </div>
    </div>
    <div class="block__item block__item--error" data-ng-if="!(settingType | validSettingType)">
        {{settingType.settingItems[0].errorMessage}}
    </div>
</div>
