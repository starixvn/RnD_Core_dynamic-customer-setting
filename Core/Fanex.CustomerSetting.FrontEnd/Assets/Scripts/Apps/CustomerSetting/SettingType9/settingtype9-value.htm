<div data-ng-if="settingType | editableSettingType">
    <settingtype9-input class="block__cell w33-percent setting-field-wrapper"
                        data-setting-item="item"
                        data-upline-level="uplineLevel"
                        data-customer-level="customerLevel"
                        data-field-name="minBet">
    </settingtype9-input>
    <settingtype9-input class="block__cell w33-percent setting-field-wrapper"
                        data-setting-item="item"
                        data-upline-level="uplineLevel"
                        data-customer-level="customerLevel"
                        data-field-name="maxBet">
    </settingtype9-input>
    <settingtype9-input class="block__cell block__cell--no-border w33-percent w33-percent--last setting-field-wrapper"
                        data-setting-item="item"
                        data-upline-level="uplineLevel"
                        data-customer-level="customerLevel"
                        data-field-name="maxPerNumber">
     </settingtype9-input>
</div>
<div class="align-center"
     data-ng-if="!(settingType | editableSettingType)">
    <div class="block__cell w33-percent">{{item.minBet | formatNumber}}</div>
    <div class="block__cell w33-percent">{{item.maxBet | formatNumber}}</div>
    <div class="block__cell block__cell--no-border w33-percent w33-percent--last">{{item.maxPerNumber | formatNumber}}</div>
</div>
