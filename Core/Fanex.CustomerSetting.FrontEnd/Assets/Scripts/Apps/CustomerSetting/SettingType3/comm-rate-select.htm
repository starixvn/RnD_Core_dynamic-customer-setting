<div class="setting-field-wrapper">
    <div data-tooltip data-message="{{settingItem.validationState | tooltipMessage:'commissionResourceService'}}">
        <select class="setting-field"
                data-ng-model="settingItem.commRate"
                data-ng-options="item.value as item.key for item in range"
                data-ng-class="{ 'setting-field--invalid': (settingItem.validationState | highlightingField) }"></select>
    </div>
</div>
