<!DOCTYPE html>
<html data-ng-app="customerSetting">
<head>
    <meta charset="utf-8" />
    <title></title>
    <link rel="stylesheet" type="text/css" href="{{cdnUri}}/customerSetting/styles/customer-setting.min.css?v={{version}}" />
    <link rel="stylesheet" type="text/css" href="{{customCss}}" />
</head>
<body data-ng-cloak>
    <block-ui></block-ui>
    <div data-ng-controller="customerSettingController as ctrl">
        <div class="msg-container" data-ng-show="ctrl.warningMessages || ctrl.requestMsgResult">
            <setting-result data-result="ctrl.warningMessages"></setting-result>
            <setting-result data-result="ctrl.requestMsgResult"></setting-result>
        </div>
        <div class="customer-setting customer-level-{{ctrl.setting.customerLevel}}" data-ng-show="ctrl.setting">
            <customer-info data-info="ctrl.setting.customerInfo" data-names="ctrl.customerNames"></customer-info>
            <setting-type-loader data-setting="ctrl.setting" data-update="ctrl.update(settingTypeId)"></setting-type-loader>
            <button class="btn btn--margin-top" data-ng-if="ctrl.setting | editableForm" data-ng-click="ctrl.update()">{{'Update' | label}}</button>
        </div>
    </div>
    <script type="text/javascript">
        var appConfig = {{appConfig}};
        var params = {{params}};
    </script>
    <script type="text/javascript" src="{{cdnUri}}/customersetting/scripts/product-{{productId}}{{min}}.js?v={{version}}"></script>
</body>
</html>
