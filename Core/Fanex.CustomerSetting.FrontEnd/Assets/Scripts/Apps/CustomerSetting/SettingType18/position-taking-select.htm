<div>
    <div class="setting-field-wrapper">
        <select class="setting-field"
                ng-disabled="disabled === 'true' || isPartialMinPt && (settingItem.isRowCopied || (isMinPt ? !settingItem.isCheckedUpdateMinPtOnly : !settingItem.isCheckedUpdateRow))"
                data-field-name="{{fieldName}}"
                data-highlight-state="settingItem.highlightState"
                data-tooltip-message="{{settingItem.validationState | tooltipMessage:'positionTakingResourceService':fieldName}}"></select>
    </div>
</div>
