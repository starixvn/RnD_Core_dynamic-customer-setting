<label class="check-all-field">
    <input type="checkbox"
           class="setting-field--checkfield__check-ctrl"
           data-field-name="checkAll"
           data-field-highlighting
           data-tooltip-message="{{tooltipMessage}}"
           data-highlight-state="highlightState"
           data-ng-model="checked"
           data-ng-click="checkAll()" />
</label>
