<div class="customer-line">
    <table>
        <tbody>
            <tr data-ng-repeat="customer in customerLine" data-ng-switch="$first">
                <td class="level-name" data-ng-switch-when="false">{{customer.levelName}}</td>
                <td class="level-name" data-ng-switch-when="true">Customer</td>
                <td class="customer-name" data-ng-class="{'active': $index==0}">{{customer.name}} ({{customer.id}})</td>
            </tr>
        </tbody>
    </table>
</div>
