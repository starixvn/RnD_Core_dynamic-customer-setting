<!DOCTYPE html>
<html data-ng-app="customerSettingMatrix">
<head>
    <meta charset="utf-8" />
    <title>Setting Matrix</title>
    <link rel="stylesheet" type="text/css" href="{{cdnUri}}/customersettingmatrix/styles/customer-setting-matrix.min.css?v={{version}}" />
</head>
<body data-ng-cloak data-ng-controller="customerSettingMatrixController as ctrl">
    <div class="container">
        <div class="header" data-ng-if="ctrl.querySettingMatrix.showFilter">
            <ul class="setting-type-nav">
                <li data-ng-repeat="settingType in ctrl.settingTypes"
                    data-ng-click="ctrl.updateSettingTypeView(settingType.id)">
                    <label>
                        <input type="radio" ng-model="ctrl.querySettingMatrix.settingTypeId" ng-value="{{::settingType.id}}">
                        {{::settingType.name | label}}
                    </label>
                </li>
            </ul>

            <form class="matrix-form" data-ng-submit="ctrl.loadSettingMatrix()">

                <div class="form-control">
                    <label for="product">
                        {{'Product' | label}}
                    </label>
                    <select name="product"
                            data-ng-model="ctrl.querySettingMatrix.productId"
                            data-ng-options="product.id as product.name for product in ctrl.products"></select>
                </div>
                <div class="form-control" data-ng-if="ctrl.querySettingMatrix.settingTypeId==1">
                    <label for="sporTypeId">
                        {{'SportTypeId' | label}}
                    </label>
                    <input name="sporTypeId" type="text" data-ng-model="ctrl.querySettingMatrix.sportTypeId" />
                </div>
                <div class="form-control" data-ng-if="ctrl.querySettingMatrix.settingTypeId==1">
                    <label for="betTypeId">
                        {{'BetTypeId' | label}}
                    </label>
                    <input name="betTypeId" type="text" data-ng-model="ctrl.querySettingMatrix.betTypeId" />
                </div>
                <div class="form-control check-box-control" data-ng-if="ctrl.querySettingMatrix.settingTypeId==1">
                    <label for="isLive">
                        {{'IsLive' | label}}
                        <input name="isLive" id="isLive" type="checkbox" data-ng-model="ctrl.querySettingMatrix.isLive" />
                    </label>
                </div>
                <div class="form-control">
                    <label for="userName">
                        {{'Username' | label}}
                    </label>
                    <input name="userName" type="text" data-ng-model="ctrl.querySettingMatrix.customerName" />
                </div>
                <div class="form-control">
                    <button type="submit">
                        {{'Submit' | label}}
                    </button>
                </div>
            </form>
        </div>

        <div class="error-message-container" data-ng-show="ctrl.errorMessage">
            <div class="error-icon"></div>
            <div class="content">{{ctrl.errorMessage}}</div>
        </div>

        <div class="main-content" data-ng-show="ctrl.customerLine.length > 0">
            <div customer-line="ctrl.customerLine"
                 data-customer-line-directive>
            </div>

            <div class="matrix-container" data-ng-show="ctrl.settingTypeMatrix" data-ng-switch="ctrl.settingTypeId">
                <div data-ng-switch-when="1" product="ctrl.product" setting-type-matrix="ctrl.settingTypeMatrix" data-pt-matrix>
                </div>
                <div data-ng-switch-when="3" setting-type-matrix="ctrl.settingTypeMatrix" data-commission-matrix>
                </div>
                <div data-ng-switch-when="5" setting-type-matrix="ctrl.settingTypeMatrix" data-commission-matrix>
                </div>
            </div>
        </div>
    </div>
    <block-ui data-is-loading="ctrl.isUIblocked"></block-ui>
    <script type="text/javascript">
        var appConfig = {{appConfig}};
        var querySettingMatrix = {{querySettingMatrix}};
    </script>
    <script type="text/javascript" src="{{cdnUri}}/customersettingmatrix/customer-setting-matrix{{min}}.js?v={{version}}"></script>
</body>
</html>
