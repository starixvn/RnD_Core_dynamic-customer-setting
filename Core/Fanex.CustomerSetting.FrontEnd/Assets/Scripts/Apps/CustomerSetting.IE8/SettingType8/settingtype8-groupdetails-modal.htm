<div class="modal-overlay" data-ng-show="hostItem.showingDetails">
    <div class="modal" data-draggable="'modal-title'">
        <div id="modal-title" class="modal__title">
            {{'BetLimit' | settingType8Label}}
        </div>
        <div class="modal__content"  data-detect-max-height>
            <div data-settingtype8-group-details data-setting-type="hostItem.allDetails"></div>
        </div>
        <div class="modal__footer">
            <button class="btn btn--small" data-ng-click="cancel()">{{'Close' | settingType8Label}}</button>
        </div>
    </div>
</div>
