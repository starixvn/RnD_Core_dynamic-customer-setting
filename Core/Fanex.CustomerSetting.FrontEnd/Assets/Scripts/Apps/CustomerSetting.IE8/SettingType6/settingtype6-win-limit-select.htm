<div class="setting-field-wrapper">
    <select class="setting-field"
            data-ng-model="settingItem.winLimit"
            data-ng-options="item.key as item.value for item in range"
            data-tooltip
            data-message="{{settingItem.validationState | tooltipMessage:'settingType6ResourceService':'winLimit':'unlimitedLimit'}}"
            data-ng-class="{ 'setting-field--invalid': (settingItem.validationState | highlightingField:'winLimit') }"></select>
    <span>{{'OnGivenCredit' | settingType6Label}}</span>
</div>
