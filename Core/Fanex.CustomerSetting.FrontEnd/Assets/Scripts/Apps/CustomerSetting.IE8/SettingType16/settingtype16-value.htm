<div data-ng-if="settingType | editableSettingType">
    <div class="block__cell w33-percent setting-field-wrapper"
         data-settingtype16-input
         data-setting-item="item"
         data-upline-level="uplineLevel"
         data-customer-level="customerLevel"
         data-field-name="minBet">
    </div>
    <div class="block__cell w33-percent setting-field-wrapper"
         data-settingtype16-input
         data-setting-item="item"
         data-upline-level="uplineLevel"
         data-customer-level="customerLevel"
         data-field-name="maxBet">
    </div>
    <div class="block__cell block__cell--no-border w33-percent w33-percent--last setting-field-wrapper"
         data-settingtype16-input
         data-setting-item="item"
         data-upline-level="uplineLevel"
         data-customer-level="customerLevel"
         data-field-name="maxPerMatch">
    </div>
</div>
<div class="align-center"
     data-ng-if="!(settingType | editableSettingType)">
    <div class="block__cell w33-percent">{{item.minBet | formatNumber}}</div>
    <div class="block__cell w33-percent">{{item.maxBet | formatNumber}}</div>
    <div class="block__cell block__cell--no-border w33-percent w33-percent--last">{{item.maxPerMatch | formatNumber}}</div>
</div>
