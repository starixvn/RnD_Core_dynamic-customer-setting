﻿<div class="setting-field-wrapper">
     <label class="setting-field--checkfield">
         <input type="checkbox"
                class="setting-field--checkfield__check-ctrl"
                data-ng-if="settingType | editableSettingType"
                data-field-highlighting
                data-field-name="isDisabled"
                data-highlight-state="item.highlightState"
                data-tooltip-message="{{item.validationState | tooltipMessage:'settingType13ResourceService':'isDisabled'}}"
                data-ng-change="item.toggleCheck();"
                data-ng-model="item.isChecked"
                data-ng-disabled="item.readonly" />
         <input type="checkbox"
                class="setting-field--checkfield__check-ctrl"
                disabled="disabled"
                data-ng-if="!(settingType | editableSettingType)"
                data-ng-model="item.isChecked" />
         <span data-ng-if="customerLevel === avaiCustomerLevels.superAgent">{{'Super' | label}}</span>
         <span data-ng-if="customerLevel === avaiCustomerLevels.masterAgent">{{'Master' | label}}</span>
         <span data-ng-if="customerLevel === avaiCustomerLevels.agent">{{'Agent' | label}}</span>
         <span data-ng-if="customerLevel === avaiCustomerLevels.member">{{'Member' | label}}</span>
     </label>
</div>
