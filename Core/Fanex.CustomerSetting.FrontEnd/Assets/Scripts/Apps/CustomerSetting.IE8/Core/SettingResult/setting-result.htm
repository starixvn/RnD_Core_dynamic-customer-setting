<div data-ng-show="result">
    <div class="msg msg--{{result.msgTypeName}}" data-ng-if="!result.subResults">
        <div class="icon msg__icon"></div>
        <div class="msg__content">{{result.message}}</div>
    </div>
    <div data-ng-if="result.subResults" data-ng-repeat="subResult in result.subResults">
        <div class="msg__customer-name"
             data-ng-if="subResult.customerName">
            {{subResult.customerName}}
        </div>
        <div class="msg msg--{{subResult.msgTypeName}}"
             data-ng-if="!subResult.settingResults">
            <div class="icon msg__icon"></div>
            <div class="msg__content">{{subResult.message}}</div>
        </div>
        <div class="msg msg--{{settingResult.msgTypeName}}"
             data-ng-if="subResult.settingResults"
             data-ng-repeat="settingResult in subResult.settingResults">
            <div class="icon msg__icon"></div>
            <div class="msg__content">
                <div class="msg__main-message">{{settingResult.message}}</div>
                <div class="msg__sub-message"
                     data-ng-if="settingResult.messages"
                     data-ng-repeat="message in settingResult.messages">
                    {{message}}
                </div>
            </div>
        </div>
    </div>
</div>
