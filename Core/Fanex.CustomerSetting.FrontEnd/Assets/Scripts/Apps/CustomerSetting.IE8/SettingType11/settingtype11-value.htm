﻿<div class="setting-field-wrapper" data-ng-if="settingType | editableSettingType">
    <label class="setting-field--checkfield">
        <input type="checkbox"
               class="setting-field--checkfield__check-ctrl"
               data-tooltip
               data-message="{{item.validationState | tooltipMessage:'settingType11ResourceService':'isDisabled'}}"
               data-settingtype11-checkbox
               data-ng-change="change()"
               data-ng-model="item.isChecked"
               data-ng-disabled="item.readonly"
               data-ng-class="{ 'setting-field--invalid': (item.validationState | highlightingField:'isDisabled') }" />
        {{'Enable' | settingType11Label}}
    </label>
    <label class="setting-field--checkfield" data-ng-show="item.downline && (customerLevel > avaiCustomerLevels.member)">
        <input type="checkbox"
               class="setting-field--checkfield__check-ctrl"
               data-tooltip
               data-message="{{item.validationState | tooltipMessage:'settingType11ResourceService':'downline.isDisabled'}}"
               data-settingtype11-checkbox
               data-ng-change="change()"
               data-ng-model="item.downline.isChecked"
               data-ng-disabled="item.downline.readonly"
               data-ng-class="{ 'setting-field--invalid': (item.validationState | highlightingField:'downline.isDisabled') }" />
        {{'EnableDownline' | settingType11Label}}
    </label>
</div>
<div class="setting-field-wrapper" data-ng-if="!(settingType | editableSettingType)">
    <label class="setting-field--checkfield">
        <input type="checkbox"
               class="setting-field--checkfield__check-ctrl"
               disabled="disabled"
               data-ng-model="item.isChecked" />
        {{'Enable' | settingType11Label}}
    </label>
    <label class="setting-field--checkfield" data-ng-show="item.downline && (customerLevel > avaiCustomerLevels.member)">
        <input type="checkbox"
               class="setting-field--checkfield__check-ctrl"
               disabled="disabled"
               data-ng-model="item.downline.isChecked" />
        {{'EnableDownline' | settingType11Label}}
    </label>
</div>
