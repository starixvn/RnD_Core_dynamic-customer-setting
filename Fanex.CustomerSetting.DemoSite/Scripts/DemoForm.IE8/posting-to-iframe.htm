<form action="{{path}}" target="{{frameName}}" method="post" class="hide">
    <input type="hidden" name="language" value="{{language}}" />
    <input type="hidden" name="productId" value="{{productId}}" />
    <input type="hidden" name="customerLevel" value="{{customerLevel}}" />
    <input type="hidden" name="uplineLevel" value="{{uplineLevel}}" data-ng-if="uplineLevel" />
    <input type="hidden" name="customerId" value="{{customerId}}" data-ng-if="!isMultiple" />
    <input type="hidden" name="isMultiple" value="{{isMultiple}}" data-ng-if="isMultiple" />
    <input type="hidden" name="customerIds" value="{{customerIds}}" data-ng-if="isMultiple" />
    <input type="hidden" name="customerNames" value="{{customerNames}}" data-ng-if="isMultiple" />
</form>
