<div data-ng-if="(settingType | editableSettingType) && (customerLevel !== avaiCustomerLevels.member || uplineLevel === avaiCustomerLevels.agent)">
    <bet-setting-input class="block__cell w33-percent setting-field-wrapper"
                       data-setting-item="item"
                       data-upline-level="uplineLevel"
                       data-customer-level="customerLevel"
                       data-field-name="minBet">
    </bet-setting-input>
    <bet-setting-input class="block__cell w33-percent setting-field-wrapper"
                       data-setting-item="item"
                       data-upline-level="uplineLevel"
                       data-customer-level="customerLevel"
                       data-field-name="maxBet">
    </bet-setting-input>
    <bet-setting-input class="block__cell block__cell--no-border w33-percent w33-percent--last setting-field-wrapper"
                       data-setting-item="item"
                       data-upline-level="uplineLevel"
                       data-customer-level="customerLevel"
                       data-field-name="maxPerMatch">
    </bet-setting-input>
</div>
<div class="align-center"
     data-ng-if="!(settingType | editableSettingType) || (customerLevel === avaiCustomerLevels.member && uplineLevel !== avaiCustomerLevels.agent)">
    <div class="block__cell w33-percent">{{item.minBet}}</div>
    <div class="block__cell w33-percent">{{item.maxBet}}</div>
    <div class="block__cell block__cell--no-border w33-percent w33-percent--last">{{item.maxPerMatch}}</div>
</div>
