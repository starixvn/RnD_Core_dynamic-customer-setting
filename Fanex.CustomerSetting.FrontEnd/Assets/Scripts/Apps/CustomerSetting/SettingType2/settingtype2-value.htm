<div class="align-center" data-ng-if="(customerLevel === avaiCustomerLevels.member && uplineLevel !== avaiCustomerLevels.agent) || !settingType.editable">
    <div class="w33-percent">{{item.minBet}}</div>
    <div class="w33-percent">{{item.maxBet}}</div>
    <div class="w33-percent last">{{item.maxPerMatch}}</div>
</div>
<div data-ng-if="(customerLevel !== avaiCustomerLevels.member || uplineLevel === avaiCustomerLevels.agent) && settingType.editable">
    <bet-setting-input class="w33-percent"
                       data-setting-item="item"
                       data-upline-level="uplineLevel"
                       data-customer-level="customerLevel"
                       data-field-name="minBet">
    </bet-setting-input>
    <bet-setting-input class="w33-percent"
                       data-setting-item="item"
                       data-upline-level="uplineLevel"
                       data-customer-level="customerLevel"
                       data-field-name="maxBet">
    </bet-setting-input>
    <bet-setting-input class="w33-percent last"
                       data-setting-item="item"
                       data-upline-level="uplineLevel"
                       data-customer-level="customerLevel"
                       data-field-name="maxPerMatch">
    </bet-setting-input>
</div>
