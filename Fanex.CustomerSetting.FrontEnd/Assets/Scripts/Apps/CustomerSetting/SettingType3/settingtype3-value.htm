<comm-rate data-ng-if="settingType.editable && (customerLevel !== avaiCustomerLevels.member || uplineLevel === avaiCustomerLevels.agent)"
           data-setting-item="item">
</comm-rate>
<div data-ng-if="!settingType.editable && (customerLevel !== avaiCustomerLevels.member || uplineLevel === avaiCustomerLevels.agent)">
    {{item.commRate}}
</div>
<div data-ng-if="customerLevel === avaiCustomerLevels.member && uplineLevel !== avaiCustomerLevels.agent">
    <div class="w33-percent">{{item.masterCommRate}}</div>
    <div class="w33-percent">{{item.agentCommRate}}</div>
    <div class="w33-percent last">{{item.commRate}}</div>
</div>
