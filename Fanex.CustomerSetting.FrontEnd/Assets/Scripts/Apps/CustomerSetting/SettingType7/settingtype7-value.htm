<div class="setting-field-wrapper" data-ng-if="settingType | editableSettingType">
    <input type="text"
           maxlength="5"
           data-ng-model="item.chargedCommission"
           data-settingtype7-input
           data-ng-change="updateValue()"
           data-tooltip
           data-message="{{item.validationState | tooltipMessage:'settingType7ResourceService':'chargedCommission'}}"
           data-ng-class="{ 'setting-field--invalid': (item.validationState | highlightingField: 'chargedCommission') }"
           class="setting-field setting-field--fullwidth setting-field--number setting-field--has-constraint" />
    <span data-ng-if="item.upline.chargedCommission > 0"> >={{item.upline.chargedCommission | number}}</span>
</div>
<div class="setting-field-wrapper"
     data-ng-if="!(settingType | editableSettingType) || (customerLevel === avaiCustomerLevels.member)">
    {{item.commRate | number}}
</div>
