<div class="block" data-ng-show="settingType">
    <div class="block__header" data-setting-type="{{settingType.id}}">
        {{settingTypeName}}
        <div class="right-btn-area right-btn-area--seperate"
             title="{{'Update' | label}}"
             data-ng-if="(settingType | editableSettingType) && (settingType | validSettingType)"
             data-ng-click="update({ settingTypeId: settingType.id })">
            <span class="icon icon--update"></span>
        </div>
    </div>
    <div class="block__item-group" data-ng-repeat="group in sportGroups">
        <div class="block__sub-header"
             data-ng-if="(settingType.settingLevel === avaiSettingLevels.sportTypeBetType) && (settingType | validSettingType)"
             data-ng-class="{ 'block__sub-header--border-top': ($index > 0) }"
             data-sport-type="{{group[0].sportTypeId}}">
            {{group[0].sportTypeName}}
            <div data-copy-setting
                 data-ng-if="(settingType | editableSettingType) && sportGroups.length > 1 && $index === 0"
                 data-setting-type-id="settingType.id"
                 data-setting-items="sportGroups">
            </div>
        </div>
        <div class="block__lbl-group" data-ng-if="settingType | validSettingType" data-ng-include="headerTemplateUrl"></div>
        <div class="block__item"
             data-ng-if="settingType | validSettingType"
             data-ng-repeat="item in group"
             data-ng-class="{ 'block__item--last': $last,
                              'block__item--near-last': $index === group.length - 2 && $index % 2 === 0,
                              'block__item--before-extra-item': $last && group.length % 2 === 1 && group.length > 1,
                              'block__item--full-width': group.length === 1 }">
            <div class="block__lbl"
                 data-product="{{productId}}"
                 data-sport-type="{{item.sportTypeId}}"
                 data-bet-type="{{item.betTypeId}}">
                {{item | showingName:settingType.settingLevel:productName }}
                {{item.isLive ? '(' + ('Live' | label) + ')' : ''}}
                <div data-copy-setting
                     data-ng-if="(settingType | editableSettingType) && group.length > 1 && $index === 0"
                     data-setting-type-id="settingType.id"
                     data-setting-items="group">
                </div>
            </div>
            <div class="block__value" data-ng-include="valueTemplateUrl"></div>
        </div>
        <div class="block__item block__item--last block__item--extra" data-ng-if="group.length % 2 === 1 && group.length > 1">
            <div class="block__lbl"></div>
            <div class="block__value"></div>
        </div>
        <div class="block__item block__item--full-width block__item--last" data-ng-if="!(settingType | validSettingType)">
            <div class="block__value text-field-wrapper msg--error w100-percent">{{group[0].errorMessage}}</div>
        </div>
    </div>
</div>
