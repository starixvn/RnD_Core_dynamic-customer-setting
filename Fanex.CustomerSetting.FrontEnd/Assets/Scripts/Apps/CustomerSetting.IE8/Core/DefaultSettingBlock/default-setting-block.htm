<div class="block default-setting-block" data-ng-show="settingType">
    <div class="header" data-setting-type="{{settingType.id}}">
        {{settingTypeName}}
        <div class="update" title="{{'Update' | label}}" data-ng-click="update({ settingTypeId: settingType.id })">
            <span class="icon update-icon"></span>
        </div>
    </div>
    <div class="setting-type-group" data-ng-repeat="group in sportGroups">
        <div class="header sub-group-header"
             data-ng-if="settingType.settingLevel === avaiSettingLevels.sportTypeBetType"
             data-ng-class="{ 'not-first': ($index > 0) }"
             data-sport-type="{{group[0].sportTypeId}}">
            {{group[0].sportTypeName}}
            <div data-copy-setting data-ng-if="sportGroups.length > 1 && $index === 0"
                          data-setting-type-id="settingType.id"
                          data-setting-items="sportGroups">
            </div>
        </div>
        <div class="header" data-ng-include="headerTemplateUrl"></div>
        <div class="setting-group"
             data-ng-repeat="item in group"
             data-ng-class="{ 'last': $last, 'near-last': ($index === group.length - 2) && ($index % 2 === 0), 'only-one': group.length === 1 }">
            <div class="name-col"
                 data-product="{{productId}}"
                 data-sport-type="{{item.sportTypeId}}"
                 data-bet-type="{{item.betTypeId}}">
                {{item | showingName:settingType.settingLevel:productName }}
                {{item.isLive ? '(' + ('Live' | label) + ')' : ''}}
                <div data-copy-setting data-ng-if="group.length > 1 && $index === 0"
                              data-setting-type-id="settingType.id"
                              data-setting-items="group">
                </div>
            </div>
            <div class="value-col"
                 data-ng-include="valueTemplateUrl"
                 data-ng-class="{'last': $index % 2 === 1 }">
            </div>
        </div>
        <div class="setting-group extended-setting-group last"
             data-ng-if="(group.length % 2 === 1) && (group.length > 1)">
            <div class="name-col"></div>
            <div class="value-col last"></div>
        </div>
    </div>
</div>
