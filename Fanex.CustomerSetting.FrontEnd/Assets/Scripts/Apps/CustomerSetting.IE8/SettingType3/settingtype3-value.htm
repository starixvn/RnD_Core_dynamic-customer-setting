<div data-ng-if="settingType.editable && (customerLevel !== avaiCustomerLevels.member || uplineLevel === avaiCustomerLevels.agent)"
     data-comm-rate data-setting-item="item">
</div>
<div class="align-center" data-ng-if="!settingType.editable && (customerLevel !== avaiCustomerLevels.member || uplineLevel === avaiCustomerLevels.agent)">
    {{item.commRate}}
</div>
<div class="align-center" data-ng-if="customerLevel === avaiCustomerLevels.member && uplineLevel === avaiCustomerLevels.superAgent">
    <div class="block__cell w33-percent">{{item.upline.upline.commRate}}</div>
    <div class="block__cell w33-percent">{{item.upline.commRate}}</div>
    <div class="block__cell block__cell--no-border w33-percent w33-percent--last">{{item.commRate}}</div>
</div>
<div class="align-center" data-ng-if="customerLevel === avaiCustomerLevels.member && uplineLevel === avaiCustomerLevels.masterAgent">
    <div class="block__cell w50-percent">{{item.upline.commRate}}</div>
    <div class="block__cell block__cell--no-border w50-percent">{{item.commRate}}</div>
</div>
