<!DOCTYPE html>
<html data-ng-app="customerSettingMatrix">
<head>
    <meta charset="utf-8" />
    <title>Setting Matrix</title>
    <link rel="stylesheet" type="text/css" href="{{rootUrl}}app/CustomerSettingMatrix/styles/customer-setting-matrix.min.css?v={{version}}" />
</head>
<body data-ng-cloak data-ng-controller="customerSettingMatrixController as ctrl">
    <div class="container">
        <div class="header">
            <ul class="setting-type-nav">
                <li data-ng-repeat="settingType in ctrl.settingTypes"
                    data-ng-click="ctrl.updateSettingTypeView(settingType.id)">
                    <label>
                        <input type="radio" ng-model="ctrl.settingTypeId" ng-value="{{::settingType.id}}">
                        {{::settingType.name | label}}
                    </label>
                </li>
            </ul>

            <form class="matrix-form" data-ng-submit="ctrl.querySettingMatrix(ctrl.customerName)">

                <div class="form-control">
                    <label for="product">
                        {{'Product' | label}}
                    </label>
                    <select name="product" data-ng-model="ctrl.product" data-ng-options="product.name for product in ctrl.products"></select>
                </div>
                <div class="form-control">
                    <label for="userName">
                        {{'Username' | label}}
                    </label>
                    <input name="userName" type="text" data-ng-model="ctrl.customerName" />

                </div>
                <div class="form-control">
                    <button type="submit">
                        {{'Submit' | label}}
                    </button>
                </div>
            </form>



        </div>

        <div class="error-message-container" data-ng-show="ctrl.errorMessage">
            <div class="error-icon"></div>
            <div class="content">{{ctrl.errorMessage}}</div>
        </div>

        <div class="main-content" data-ng-show="ctrl.customerLine.length > 0">
            <div customer-line="ctrl.customerLine"
                 customer-name="ctrl.customerName"
                 query-setting-matrix="ctrl.querySettingMatrix(customerName)"
                 data-customer-line-directive>
            </div>

            <div class="matrix-container" data-ng-show="ctrl.settingTypeMatrix" data-ng-switch="ctrl.settingTypeId">
                <div data-ng-switch-when="1" product="ctrl.product" setting-type-matrix="ctrl.settingTypeMatrix" data-pt-matrix>
                </div>
                <div data-ng-switch-when="3" setting-type-matrix="ctrl.settingTypeMatrix" data-commission-matrix>
                </div>
            </div>
        </div>

    </div>
    <block-ui data-is-loading="ctrl.isUIblocked"></block-ui>
    <script type="text/javascript">
        var appConfig = {{appConfig}};
        var customerName = "{{customerName}}";
    </script>
    <script type="text/javascript" src="{{rootUrl}}scripts/libraries/angular/angular.min.js?v={{version}}"></script>
    <script type="text/javascript" src="{{rootUrl}}app/customersettingmatrix/customer-setting-matrix{{min}}.js?v={{version}}"></script>
</body>
</html>
