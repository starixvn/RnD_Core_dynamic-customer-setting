<div data-fanex-message>
</div>
<div class="product-container">
    <div class="container" data-ng-show="custNames">
        <div class="header">
            {{custNames}}
        </div>
    </div>
    <div class="container" data-ng-show="information">
        <div class="header">
            {{'GeneralInformation' | fanexTranslate}}
        </div>
        <div class="body" data-fanex-customer-information="information">
        </div>
    </div>
    <div data-fanex-status-container="statusModel">
    </div>
    <div data-fanex-discount-container="discountModel">
    </div>
    <div data-fanex-bet-limit-container="betLimitModel">
    </div>
    <div data-fanex-pt-container="positionTakingModel">
    </div>
    <button class="update" data-ng-show="hasUpdateAll" data-ng-click="updateAll()">
        {{'Update' | fanexTranslate}}
    </button>
</div>
<div data-fanex-tooltip>
</div>
<div data-fanex-pt-update-member-dialog>
</div>
