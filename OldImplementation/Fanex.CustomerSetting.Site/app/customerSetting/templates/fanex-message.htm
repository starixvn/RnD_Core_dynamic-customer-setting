<div class="message-container" data-ng-show="users">
    <div data-ng-repeat="user in users">
        <div class="name" data-ng-show="user.name">
            {{user.name}}
        </div>
        <div data-ng-repeat="message in user.messages" class="message" data-ng-class="message.class">
            <div class="icon">
            </div>
            <div class="content" data-ng-bind-html="message.content">
            </div>
        </div>
    </div>
</div>
