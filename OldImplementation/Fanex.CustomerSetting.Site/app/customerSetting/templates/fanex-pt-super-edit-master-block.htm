<div class="position-taking-block super-edit-master">
    <div class="row-title">
        <div class="col-name">
        </div>
        <div class="super-pt">
            {{'SuperPT' | fanexTranslate}}
        </div>
        <div class="super-is-auto">
            {{'IsAuto' | fanexTranslate}}
        </div>
        <div class="master-max-pt">
            {{'MasterMaxPT' | fanexTranslate}}
        </div>
        <div class="master-min-pt">
            {{'MasterMinPT' | fanexTranslate}}
        </div>
    </div>
    <div data-ng-repeat="item in items" data-fanex-pt-super-edit-master-item="item"
        data-setting-level="settingLevel" data-has-copy="$first && hasCopy">
    </div>
</div>
