<div class="status-item">
    <div class="col-name" title="{{name}}">
        <div class="pull-left">
            {{name}}
        </div>
        <div data-ng-if="hasCopy" data-fanex-item-copy data-setting-type="settingType">
        </div>
    </div>
    <div class="col-value">
        <label class="checkbox">
            <input type="checkbox" data-ng-model="enable" data-ng-disabled="enableDisabled" />
            {{'Enable' | fanexTranslate}}
        </label>
        <label class="checkbox downline" data-ng-show="showDownline">
            <input type="checkbox" data-ng-model="downline" data-ng-disabled="downlineDisabled" />
            {{'EnableDownline' | fanexTranslate}}
        </label>
    </div>
</div>
