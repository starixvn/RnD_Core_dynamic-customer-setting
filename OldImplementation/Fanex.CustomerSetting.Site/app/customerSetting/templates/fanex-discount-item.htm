<div class="discount-item">
    <div class="col-name" title="{{name}}">
        <div class="pull-left">
            {{name}}
        </div>
        <div data-ng-if="hasCopy" data-fanex-item-copy data-setting-type="settingType">
        </div>
    </div>
    <div class="col-value">
        <select data-ng-model="value" data-ng-options="option for option in options">
        </select>
    </div>
</div>
