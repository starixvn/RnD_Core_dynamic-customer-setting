<div class="position-taking-item">
    <div class="col-name" title="{{name}}">
        <div class="pull-left">
            {{name}}
        </div>
        <div data-ng-if="hasCopy" data-fanex-pt-copy>
        </div>
    </div>
    <div class="super-pt" data-fanex-pt-select="superPT">
    </div>
    <div class="super-is-auto">
        <label class="checkbox">
            <input type="checkbox" data-ng-model="superIsAuto" />
        </label>
    </div>
    <div class="master-pt" data-ng-bind="masterPT | fanexPtFormat">
    </div>
    <div class="agent-pt" data-ng-bind="agentPT | fanexPtFormat">
    </div>
</div>
