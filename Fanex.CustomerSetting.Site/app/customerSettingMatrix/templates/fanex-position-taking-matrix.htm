<div class="group" data-ng-repeat="group in groups">
    <div class="group-name">
        {{group.Name}}
    </div>
    <div class="table" data-ng-repeat="table in group.Tables">
        <div class="table-name">
            {{table.Name}}
        </div>
        <table>
            <colgroup>
                <col width="80" />
                <col width="50" />
                <col width="50" />
                <col width="50" />
                <col width="50" />
                <col width="50" />
                <col width="50" />
                <col width="50" />
                <col width="50" />
            </colgroup>
            <thead>
                <tr>
                    <th>
                    </th>
                    <th>
                        Super
                    </th>
                    <th>
                        Master
                    </th>
                    <th>
                        Agent
                    </th>
                    <th>
                        US
                    </th>
                    <th>
                        IS
                    </th>
                    <th>
                        UM
                    </th>
                    <th>
                        IM
                    </th>
                    <th>
                        N
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr data-ng-repeat="row in table.Rows">
                    <td>
                        {{row.RoleId | fanexRoleFormat}}
                    </td>
                    <td>
                        {{row.SuperPT | fanexPtFormat}}
                    </td>
                    <td>
                        {{row.MasterPT | fanexPtFormat}}
                    </td>
                    <td>
                        {{row.AgentPT | fanexPtFormat}}
                    </td>
                    <td>
                        {{row.AutoSuperPT | fanexPtFormat}}
                    </td>
                    <td data-ng-switch="row.IsAutoSuperPT !== undefined">
                        <input data-ng-switch-when="true" type="checkbox" value="row.IsAutoSuperPT" disabled="disabled" />
                    </td>
                    <td data-ng-switch="row.RoleId==3 && !disableAutoMPT">
                        <div data-ng-switch-when="true">
                            <div class="icon-auto-pt">
                            </div>
                        </div>
                        <div data-ng-switch-when="false">
                            {{row.AutoMasterPT | fanexPtFormat}}
                        </div>
                    </td>
                    <td data-ng-switch="row.RoleId==3 && !disableAutoMPT" data-ng-class="{'auto-pt': row.RoleId==3 && !disableAutoMPT}">
                        <div data-ng-switch-when="false">
                            <div data-ng-switch="row.IsAutoMasterPT !== undefined">
                                <input data-ng-switch-when="true" type="checkbox" value="row.IsAutoMasterPT" disabled="disabled" />
                            </div>
                        </div>
                    </td>
                    <td>
                        {{row.MinPT | fanexPtFormat}}
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
