<div class="group" data-ng-repeat="table in tables">
    <div data-ng-show="table.Name" class="group-name">
        {{table.Name}}
    </div>
    <div class="table">
        <table>
            <colgroup>
                <col width="80" />
                <col width="50" data-ng-repeat="column in table.TotalOfColumn" />
            </colgroup>
            <thead>
                <tr>
                    <th>
                    </th>
                    <th data-ng-repeat="column in table.Columns">
                        {{column.Name}}
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr data-ng-repeat="row in table.Rows">
                    <td>
                        {{row.Name}}
                    </td>
                    <td data-ng-repeat="column in row.Columns">
                        {{column.Value}}
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
