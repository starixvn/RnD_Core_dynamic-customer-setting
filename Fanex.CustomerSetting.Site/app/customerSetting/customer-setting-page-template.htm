<!DOCTYPE html>
<html data-ng-app="customerSettingApp">
<head>
    <title>Customer Setting Application</title>
    <link href="{{rootUrl}}/app/customerSetting/customer-setting{{min}}.css?v={{version}}"
        rel="stylesheet" type="text/css" />
</head>
<body data-ng-controller="CustomerSettingViewController" data-root-url="{{rootUrl}}">
    <div class="customer-setting" data-ng-cloak>
        <div data-customer-setting-message="messages">
        </div>
        <div data-ng-include="view">
        </div>
        <div data-customer-setting-tooltip>
        </div>
        <div data-customer-setting-dialog="updateModal">
        </div>
        <div data-customer-setting-block-ui>
        </div>
    </div>
    <script src="{{rootUrl}}/app/angular-1.2.28.js" type="text/javascript"></script>
    <script src="{{rootUrl}}/app/customerSetting/customer-setting{{min}}.js?v={{version}}"
        type="text/javascript"></script>
</body>
</html>
