<!DOCTYPE html>
<html data-ng-app="customerSettingApp">
<head>
    <title>{{title}}</title>
    <link href="/app/customerSetting/customer-setting.css" rel="stylesheet" type="text/css" />
</head>
<body data-ng-controller="CustomerSettingViewController">
    <div class="customer-setting" data-ng-cloak>
        <div class="message-container" data-ng-class="messageClass" data-ng-show="hasMessage"
            data-ng-bind-html="message">
        </div>
        <div data-ng-include="view">
        </div>
        <div data-customer-setting-tooltip>
        </div>
        <div class="loading-container" data-ng-show="hasLoading">
            <div class="block-overlay">
            </div>
            <div class="block-loading">
            </div>
        </div>
    </div>
    <script src="/app/angular-1.2.28.js" type="text/javascript"></script>
    <script src="/app/customerSetting/customer-setting.js" type="text/javascript"></script>
</body>
</html>
