<div class="container" data-ng-show="model">
    <div class="header">
        {{'PositionTaking' | fanexTranslate}} <span data-ng-show="model.HasUpdate" title="{{'Update' | fanexTranslate}}"
            class="update" data-ng-click="model.Update()"><i class="icon-update"></i></span>
    </div>
    <div class="body" data-ng-switch on="formType">
        <div data-ng-switch-when="1">
            <div data-fanex-pt-company-edit-super-block data-collection="model.Collection" data-setting-level="model.SettingLevel">
            </div>
        </div>
        <div data-ng-switch-when="2">
            <div data-fanex-pt-super-edit-master-block data-collection="model.Collection" data-setting-level="model.SettingLevel">
            </div>
        </div>
        <div data-ng-switch-when="3">
            <div data-fanex-pt-master-edit-agent-block data-collection="model.Collection" data-setting-level="model.SettingLevel">
            </div>
        </div>
        <div data-ng-switch-when="4">
            <div data-fanex-pt-agent-edit-member-block data-collection="model.Collection" data-setting-level="model.SettingLevel">
            </div>
        </div>
        <div data-ng-switch-when="5">
            <div data-fanex-pt-super-edit-member-block data-collection="model.Collection" data-setting-level="model.SettingLevel">
            </div>
        </div>
        <div data-ng-switch-when="6">
            <div data-fanex-pt-master-edit-member-block data-collection="model.Collection" data-setting-level="model.SettingLevel">
            </div>
        </div>
    </div>
</div>
