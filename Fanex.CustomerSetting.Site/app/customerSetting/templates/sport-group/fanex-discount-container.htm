<div class="discount-container" data-ng-init="discountGroups=(discounts|fanexDataGroup)">
    <div data-ng-repeat="discountGroup in discountGroups" class="sport-group">
        <div class="sport-name" title="{{discountGroup.SportTypeName}}">
            {{discountGroup.SportTypeName}}
        </div>
        <div data-ng-repeat="discount in discountGroup.Items" data-fanex-discount="discount" data-form-type="formType"
            data-setting-level="discountLevel" data-ng-class="{'full-width': $last && $even}">
        </div>
    </div>
</div>
