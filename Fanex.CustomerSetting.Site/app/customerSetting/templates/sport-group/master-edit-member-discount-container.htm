<div class="discount-container master-edit-member" data-ng-init="discountGroups=(discounts|dataGroup)">
    <div data-ng-repeat="discountGroup in discountGroups" class="sport-group">
        <div class="sport-name" title="{{discountGroup.SportTypeName}}">
            {{discountGroup.SportTypeName}}
        </div>
        <div class="title">
            <div class="name">
            </div>
            <div class="agent-discount">
                {{resourceService.getString('CommissionForAgent')}}
            </div>
            <div class="member-discount">
                {{resourceService.getString('CommissionForMember')}}
            </div>
        </div>
        <div data-ng-repeat="item in discountGroup.Items" data-master-edit-member-discount="item">
        </div>
    </div>
</div>
