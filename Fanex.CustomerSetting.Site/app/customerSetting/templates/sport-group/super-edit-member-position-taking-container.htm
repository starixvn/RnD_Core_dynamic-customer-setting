<div class="position-taking-container super-edit-member" data-ng-init="positionTakingGroups=(positionTakings|dataGroup)">
    <div data-ng-repeat="positionTakingGroup in positionTakingGroups" class="sport-group">
        <div class="sport-name" title="{{positionTakingGroup.SportTypeName}}">
            {{positionTakingGroup.SportTypeName}}
        </div>
        <div class="title">
            <div class="name">
            </div>
            <div class="super-pt">
                {{resourceService.getString('SuperPT')}}
            </div>
            <div class="super-is-auto">
                {{resourceService.getString('IsAuto')}}
            </div>
            <div class="master-pt">
                {{resourceService.getString('MasterPT')}}
            </div>
            <div class="master-pt">
                {{resourceService.getString('AgentPT')}}
            </div>
        </div>
        <div data-ng-repeat="item in positionTakingGroup.Items" data-super-edit-member-position-taking="item"
            data-has-copy="item==positionTakings[0] && positionTakings.length>=2">
        </div>
    </div>
</div>
