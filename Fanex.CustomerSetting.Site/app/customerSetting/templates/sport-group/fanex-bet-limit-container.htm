<div data-ng-init="betLimitGroups=(betLimits|fanexDataGroup)" class="bet-limit-container">
    <div data-ng-repeat="betLimitGroup in betLimitGroups" class="sport-group">
        <div class="sport-name" title="{{betLimitGroup.SportTypeName}}">
            {{betLimitGroup.SportTypeName}}
        </div>
        <div class="title">
            <div class="name">
            </div>
            <div class="min-bet">
                {{'MinBet' | fanexTranslate}}
            </div>
            <div class="max-bet">
                {{'MaxBet' | fanexTranslate}}
            </div>
            <div class="max-per-match">
                {{'MaxPerMatch' | fanexTranslate}}
            </div>
        </div>
        <div data-ng-repeat="betLimit in betLimitGroup.Items" data-fanex-bet-limit="betLimit"
            data-form-type="formType" data-setting-level="betLimitLevel" data-has-copy="betLimit==betLimits[0] && betLimits.length>=2">
        </div>
    </div>
</div>
