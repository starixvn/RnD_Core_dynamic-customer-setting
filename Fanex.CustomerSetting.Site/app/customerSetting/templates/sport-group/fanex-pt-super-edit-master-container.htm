<div class="position-taking-container super-edit-master" data-ng-init="positionTakingGroups=(positionTakings|fanexDataGroup)">
    <div data-ng-repeat="positionTakingGroup in positionTakingGroups" class="sport-group">
        <div class="sport-name" title="{{positionTakingGroup.SportTypeName}}">
            {{positionTakingGroup.SportTypeName}}
        </div>
        <div class="title">
            <div class="name">
            </div>
            <div class="super-pt">
                {{'SuperPT' | fanexTranslate}}
            </div>
            <div class="super-is-auto">
                {{'IsAuto' | fanexTranslate}}
            </div>
            <div class="master-max-pt">
                {{'MasterMaxPT' | fanexTranslate}}
            </div>
            <div class="master-min-pt">
                {{'MasterMinPT' | fanexTranslate}}
            </div>
        </div>
        <div data-ng-repeat="positionTaking in positionTakingGroup.Items" data-fanex-pt-super-edit-master="positionTaking"
            data-setting-level="positionTakingLevel" data-has-copy="positionTaking==positionTakings[0] && positionTakings.length>=2">
        </div>
    </div>
</div>
