<div class="position-taking-container company-edit-super" data-ng-init="positionTakingGroups=(positionTakings|fanexDataGroup)">
    <div data-ng-repeat="positionTakingGroup in positionTakingGroups" class="sport-group">
        <div class="sport-name" title="{{positionTakingGroup.SportTypeName}}">
            {{positionTakingGroup.SportTypeName}}
        </div>
        <div class="title">
            <div class="name">
            </div>
            <div class="super-max-pt">
                {{'SuperMaxPT' | fanexTranslate}}
            </div>
            <div class="master-max-pt">
                {{'MasterMaxPT' | fanexTranslate}}
            </div>
            <div class="agent-max-pt">
                {{'AgentMaxPT' | fanexTranslate}}
            </div>
            <div class="super-min-pt">
                {{'SuperMinPT' | fanexTranslate}}
            </div>
        </div>
        <div data-ng-repeat="positionTaking in positionTakingGroup.Items" data-fanex-pt-company-edit-super="positionTaking"
            data-setting-level="positionTakingLevel" data-has-copy="positionTaking==positionTakings[0] && positionTakings.length>=2">
        </div>
    </div>
</div>
