<div class="status-container" data-ng-init="statusGroups=(statuses|fanexDataGroup)">
    <div data-ng-repeat="statusGroup in statusGroups" class="sport-group">
        <div class="sport-name" title="{{statusGroup.SportTypeName}}">
            {{statusGroup.SportTypeName}}
        </div>
        <div data-ng-repeat="status in statusGroup.Items" class="status-item" data-fanex-status="status"
            data-setting-level="statusLevel" data-form-type="formType" data-ng-class="{'full-width': $last && $even}">
        </div>
    </div>
</div>
