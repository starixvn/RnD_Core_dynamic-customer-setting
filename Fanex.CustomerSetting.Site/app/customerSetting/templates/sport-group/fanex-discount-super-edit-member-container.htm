<div class="discount-container super-edit-member" data-ng-init="discountGroups=(discounts|fanexDataGroup)">
    <div data-ng-repeat="discountGroup in discountGroups" class="sport-group">
        <div class="sport-name" title="{{discountGroup.SportTypeName}}">
            {{discountGroup.SportTypeName}}
        </div>
        <div class="title">
            <div class="name">
            </div>
            <div class="master-discount">
                {{'CommissionForMaster' | fanexTranslate}}
            </div>
            <div class="agent-discount">
                {{'CommissionForAgent' | fanexTranslate}}
            </div>
            <div class="member-discount">
                {{'CommissionForMember' | fanexTranslate}}
            </div>
        </div>
        <div data-ng-repeat="discount in discountGroup.Items" data-fanex-discount-super-edit-member="discount"
            data-setting-level="discountLevel">
        </div>
    </div>
</div>
