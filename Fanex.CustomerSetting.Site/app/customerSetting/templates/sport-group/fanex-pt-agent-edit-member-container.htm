<div class="position-taking-container agent-edit-member" data-ng-init="positionTakingGroups=(positionTakings|fanexDataGroup)">
    <div data-ng-repeat="positionTakingGroup in positionTakingGroups" class="sport-group">
        <div class="sport-name" title="{{positionTakingGroup.SportTypeName}}">
            {{positionTakingGroup.SportTypeName}}
        </div>
        <div class="title">
            <div class="name">
            </div>
            <div class="agent-pt">
                {{resourceService.getString('AgentPT')}}
            </div>
        </div>
        <div data-ng-repeat="item in positionTakingGroup.Items" data-fanex-pt-agent-edit-member="item"
            data-has-copy="item==positionTakings[0] && positionTakings.length>=2">
        </div>
    </div>
</div>
