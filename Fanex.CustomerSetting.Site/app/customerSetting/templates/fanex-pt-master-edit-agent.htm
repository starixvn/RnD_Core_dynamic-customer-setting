<div class="position-taking-item">
    <div class="name" title="{{name}}">
        {{name}}
        <div data-fanex-pt-copy="hasCopy">
        </div>
    </div>
    <div class="master-pt" data-fanex-pt-select="masterPT">
    </div>
    <div class="master-is-auto">
        <label class="checkbox">
            <input type="checkbox" data-ng-model="masterIsAuto" />
        </label>
    </div>
    <div class="agent-max-pt" data-fanex-pt-select="agentMaxPT">
    </div>
    <div class="agent-min-pt" data-fanex-pt-select="agentMinPT">
    </div>
</div>
