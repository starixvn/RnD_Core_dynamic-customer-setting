<div class="dialog-container" data-ng-show="isShow">
    <div class="dialog-scrollable">
        <div class="dialog-content">
            <div class="dialog-header">
                <div class="dialog-close" data-ng-click="clickClose()">
                    <i class="icon-close"></i>
                </div>
                <div class="dialog-title">
                    {{'UpdateMemberPtTitle' | fanexTranslate}}
                </div>
            </div>
            <div class="dialog-body">
                <span>{{'UpdateMemberPtInfo' | fanexTranslate}} </span>
                <br />
                <span>{{'UpdateMemberPtQuestion' | fanexTranslate}}</span>
                <table class="position-taking-group">
                    <tbody>
                        <tr data-ng-repeat="pt in pts">
                            <td>
                                {{pt.name}}
                            </td>
                            <td>
                                <select data-ng-model="pt.value" data-fanex-pt-select-options="pt.options">
                                </select>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="dialog-footer">
                <button data-ng-click="clickYes()">
                    {{'Yes' | fanexTranslate}}
                </button>
                <button data-ng-click="clickNo()">
                    {{'No' | fanexTranslate}}
                </button>
            </div>
        </div>
    </div>
    <div class="dialog-overlay">
    </div>
</div>
