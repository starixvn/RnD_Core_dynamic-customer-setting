<div class="view" data-ng-controller="CustomerSettingController">
    <div class="container" data-ng-show="information">
        <div class="header">
            {{resourceService.getString('GeneralInformation')}}
        </div>
        <div class="body" data-customer-setting-information="information">
        </div>
    </div>
    <div class="container" data-ng-show="statuses">
        <div class="header">
            {{resourceService.getString('ProductStatus')}} <span title="{{resourceService.getString('Update')}}"
                class="update" data-ng-click="updateStatuses()"><i class="icon-update"></i></span>
        </div>
        <div class="body" data-ng-include="statusTemplate">
        </div>
    </div>
    <div class="container" data-ng-show="discounts">
        <div class="header">
            {{resourceService.getString('Commission')}} <span title="{{resourceService.getString('Update')}}"
                class="update" data-ng-click="updateDiscounts()"><i class="icon-update"></i>
            </span>
        </div>
        <div class="body" data-ng-include="discountTemplate">
        </div>
    </div>
    <div class="container" data-ng-show="betLimits">
        <div class="header">
            {{resourceService.getString('BetSetting')}} <span title="{{resourceService.getString('Update')}}"
                class="update" data-ng-click="updateBetLimits()"><i class="icon-update"></i>
            </span>
        </div>
        <div class="body" data-ng-include="betLimitTemplate">
        </div>
    </div>
    <div class="container" data-ng-show="positionTakings">
        <div class="header">
            {{resourceService.getString('PositionTaking')}} <span title="{{resourceService.getString('Update')}}"
                class="update" data-ng-click="updatePositionTakings()"><i class="icon-update"></i>
            </span>
        </div>
        <div class="body" data-ng-include="positionTakingTemplate">
        </div>
    </div>
    <button class="update" data-ng-show="information" data-ng-click="updateAll()">
        {{resourceService.getString('Update')}}
    </button>
</div>
