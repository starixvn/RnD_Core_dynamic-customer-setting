<div class="position-taking-block master-edit-agent" data-ng-class="{ 'disable-auto-mpt' : disableAutoMPT }">
    <div class="title">
        <div class="name">
        </div>
        <div class="master-pt">
            {{'MasterPT' | fanexTranslate}}
        </div>
        <div class="master-is-auto">
            {{'IsAuto' | fanexTranslate}}
        </div>
        <div class="agent-max-pt">
            {{'AgentMaxPT' | fanexTranslate}}
        </div>
        <div class="agent-min-pt">
            {{'AgentMinPT' | fanexTranslate}}
        </div>
    </div>
    <div data-ng-repeat="item in items" data-fanex-pt-master-edit-agent-item="item"
        data-setting-level="settingLevel" data-has-copy="$first && items.length>=2">
    </div>
</div>
