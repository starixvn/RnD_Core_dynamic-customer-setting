<div class="information-container">
    <div class="row">
        <div class="col-1">
            {{'UserName' | fanexTranslate}}
        </div>
        <div class="col-2" data-ng-bind="userName">
        </div>
        <div class="col-3">
            {{'Nickname' | fanexTranslate}}
        </div>
        <div class="col-4" data-ng-bind="nickName">
        </div>
    </div>
    <div class="row">
        <div class="col-1">
            {{'FirstName' | fanexTranslate}}
        </div>
        <div class="col-2" data-ng-bind="firstName">
        </div>
        <div class="col-3">
            {{'Phone' | fanexTranslate}}
        </div>
        <div class="col-4" data-ng-bind="phone">
        </div>
    </div>
    <div class="row">
        <div class="col-1">
            {{'LastName' | fanexTranslate}}
        </div>
        <div class="col-2" data-ng-bind="lastName">
        </div>
        <div class="col-3">
            {{'MobilePhone' | fanexTranslate}}
        </div>
        <div class="col-4" data-ng-bind="mobilePhone">
        </div>
    </div>
    <div class="row">
        <div class="col-1">
            {{'Fax' | fanexTranslate}}
        </div>
        <div class="col-2" data-ng-bind="fax">
        </div>
        <div class="col-3">
        </div>
        <div class="col-4">
        </div>
    </div>
</div>
