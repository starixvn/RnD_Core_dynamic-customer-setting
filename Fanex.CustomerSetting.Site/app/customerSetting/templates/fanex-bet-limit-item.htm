<div class="bet-limit-item">
    <div class="name" title="{{name}}">
        {{name}}
        <div data-fanex-item-copy="hasCopy" data-setting-type="settingType">
        </div>
    </div>
    <div class="min-bet">
        <input type="text" data-ng-model="minBet.value" data-fanex-bet-limit-input data-error-message="minBet.errorMessage()"
            data-ng-class="{'full-width': !hasMinBetLimit, 'invalid': !minBet.isValid()}" />
        <span data-ng-show="hasMinBetLimit">&gt;&#61;{{minBet.limit | number}}</span>
    </div>
    <div class="max-bet">
        <input type="text" data-ng-model="maxBet.value" data-fanex-bet-limit-input data-error-message="maxBet.errorMessage()"
            data-ng-class="{'full-width': !hasMaxBetLimit, 'invalid': !maxBet.isValid()}" />
        <span data-ng-show="hasMaxBetLimit">&lt;&#61;{{maxBet.limit | number}}</span>
    </div>
    <div class="max-per-match">
        <input type="text" data-ng-model="maxPerMatch.value" data-fanex-bet-limit-input data-error-message="maxPerMatch.errorMessage()"
            data-ng-class="{'full-width': !hasMaxPerMatchLimit, 'invalid': !maxPerMatch.isValid()}" />
        <span data-ng-show="hasMaxPerMatchLimit">&lt;&#61;{{maxPerMatch.limit | number}}</span>
    </div>
</div>
