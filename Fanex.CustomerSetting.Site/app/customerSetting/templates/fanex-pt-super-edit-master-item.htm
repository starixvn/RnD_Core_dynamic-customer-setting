<div class="position-taking-item">
    <div class="col-name" title="{{name}}">
        {{name}}
        <div data-fanex-pt-copy="hasCopy">
        </div>
    </div>
    <div class="super-pt" data-fanex-pt-select="superPT">
    </div>
    <div class="super-is-auto">
        <label class="checkbox">
            <input type="checkbox" data-ng-model="superIsAuto" />
        </label>
    </div>
    <div class="master-max-pt" data-fanex-pt-select="masterMaxPT">
    </div>
    <div class="master-min-pt" data-fanex-pt-select="masterMinPT">
    </div>
</div>
