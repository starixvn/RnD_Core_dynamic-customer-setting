<div class="position-taking-container super-edit-master">
    <div class="title">
        <div class="name">
        </div>
        <div class="super-pt">
            {{'SuperPT' | fanexTranslate}}
        </div>
        <div class="super-is-auto">
            {{'IsAuto' | fanexTranslate}}
        </div>
        <div class="master-max-pt">
            {{'MasterMaxPT' | fanexTranslate}}
        </div>
        <div class="master-min-pt">
            {{'MasterMinPT' | fanexTranslate}}
        </div>
    </div>
    <div data-ng-repeat="positionTaking in positionTakings" data-fanex-pt-super-edit-master="positionTaking"
        data-setting-level="positionTakingLevel" data-has-copy="positionTaking==positionTakings[0] && positionTakings.length>=2">
    </div>
</div>
