<div class="position-taking-container agent-edit-member">
    <div class="title">
        <div class="name">
        </div>
        <div class="agent-pt">
            {{resourceService.getString('AgentPT')}}
        </div>
    </div>
    <div data-ng-repeat="item in positionTakings" data-agent-edit-member-position-taking="item"
        data-setting-level="setting.PositionTakingLevel" data-setting-context="settingContext"

    </div>
</div>
