<div class="bet-limit-container">
    <div class="title">
        <div class="name">
        </div>
        <div class="min-bet">
            {{resourceService.getString('MinBet')}}
        </div>
        <div class="max-bet">
            {{resourceService.getString('MaxBet')}}
        </div>
        <div class="max-per-match">
            {{resourceService.getString('MaxPerMatch')}}
        </div>
    </div>
    <div data-ng-repeat="betLimit in betLimits" data-fanex-bet-limit="betLimit"
        data-has-copy="betLimit==betLimits[0] && betLimits.length>=2">
    </div>
</div>
