<div class="position-taking-container super-edit-master">
    <div class="title">
        <div class="name">
        </div>
        <div class="master-pt">
            {{resourceService.getString('MasterPT')}}
        </div>
        <div class="master-is-auto">
            {{resourceService.getString('IsAuto')}}
        </div>
        <div class="agent-pt">
            {{resourceService.getString('AgentPT')}}
        </div>
    </div>
    <div data-ng-repeat="item in positionTakings" data-master-edit-member-position-taking="item"
        data-setting-level="setting.PositionTakingLevel" data-setting-context="settingContext"
        data-form-type="formType" data-has-copy="item==positionTakings[0] && positionTakings.length>=2">
    </div>
</div>
