<div class="position-taking-container master-edit-agent" data-ng-class="{ 'disable-auto-mpt' : disableAutoMPT }">
    <div class="title">
        <div class="name">
        </div>
        <div class="master-pt">
            {{resourceService.getString('MasterPT')}}
        </div>
        <div class="master-is-auto">
            {{resourceService.getString('IsAuto')}}
        </div>
        <div class="agent-max-pt">
            {{resourceService.getString('AgentMaxPT')}}
        </div>
        <div class="agent-min-pt">
            {{resourceService.getString('AgentMinPT')}}
        </div>
    </div>
    <div data-ng-repeat="item in positionTakings" data-master-edit-agent-position-taking="item"
        data-has-copy="item==positionTakings[0] && positionTakings.length>=2">
    </div>
</div>
