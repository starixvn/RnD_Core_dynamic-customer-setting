<div class="position-taking-container master-edit-member" data-ng-class="{ 'disable-auto-mpt' : disableAutoMPT }">
    <div class="title">
        <div class="name">
        </div>
        <div class="master-pt">
            {{resourceService.getString('MasterPT')}}
        </div>
        <div class="master-is-auto">
            {{resourceService.getString('IsAuto')}}
        </div>
        <div class="agent-pt">
            {{resourceService.getString('AgentPT')}}
        </div>
    </div>
    <div data-ng-repeat="item in positionTakings" data-fanex-pt-master-edit-member="item"
        data-has-copy="item==positionTakings[0] && positionTakings.length>=2">
    </div>
</div>
