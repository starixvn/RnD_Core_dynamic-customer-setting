<div class="position-taking-container master-edit-member" data-ng-class="{ 'disable-auto-mpt' : disableAutoMPT }">
    <div class="title">
        <div class="name">
        </div>
        <div class="master-pt">
            {{'MasterPT' | fanexTranslate}}
        </div>
        <div class="master-is-auto">
            {{'IsAuto' | fanexTranslate}}
        </div>
        <div class="agent-pt">
            {{'AgentPT' | fanexTranslate}}
        </div>
    </div>
    <div data-ng-repeat="positionTaking in positionTakings" data-fanex-pt-master-edit-member="positionTaking"
        data-setting-level="positionTakingLevel" data-has-copy="positionTaking==positionTakings[0] && positionTakings.length>=2">
    </div>
</div>
