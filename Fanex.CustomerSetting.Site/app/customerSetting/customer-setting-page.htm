<!DOCTYPE html>
<html data-ng-app="customerSettingApp">
<head>
    <title>{{title}}</title>
    <link href="{{rootUrl}}/app/customerSetting/customer-setting.min.css" rel="stylesheet" type="text/css" />
</head>
<body data-ng-controller="CustomerSettingViewController" data-root-url="{{rootUrl}}">
    <div class="customer-setting" data-ng-cloak>
        <div class="message-container" data-ng-show="messages">
            <div data-ng-repeat="message in messages" class="message" data-ng-class="message.messageClass" data-ng-bind-html="message.messageContent">
            </div>
        </div>
        <div data-ng-include="view">
        </div>
        <div data-customer-setting-tooltip>
        </div>
        <div data-customer-setting-dialog="updateModal">
        </div>
        <div class="loading-container" data-ng-show="hasLoading">
            <div class="block-overlay">
            </div>
            <div class="block-loading">
            </div>
        </div>
    </div>
    <script src="{{rootUrl}}/app/angular-1.2.28.js" type="text/javascript"></script>
    <script src="{{rootUrl}}/app/customerSetting/customer-setting.min.js" type="text/javascript"></script>
</body>
</html>
