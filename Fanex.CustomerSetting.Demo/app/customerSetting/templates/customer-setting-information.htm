<div class="information-container">
    <div class="row">
        <div class="col-1">
            {{resourceService.getString('Username')}}
        </div>
        <div class="col-2" data-ng-bind="userName">
        </div>
        <div class="col-3">
            {{resourceService.getString('Nickname')}}
        </div>
        <div class="col-4" data-ng-bind="nickName">
        </div>
    </div>
    <div class="row">
        <div class="col-1">
            {{resourceService.getString('FirstName')}}
        </div>
        <div class="col-2" data-ng-bind="firstName">
        </div>
        <div class="col-3">
            {{resourceService.getString('Phone')}}
        </div>
        <div class="col-4" data-ng-bind="phone">
        </div>
    </div>
    <div class="row">
        <div class="col-1">
            {{resourceService.getString('LastName')}}
        </div>
        <div class="col-2" data-ng-bind="lastName">
        </div>
        <div class="col-3">
            {{resourceService.getString('MobilePhone')}}
        </div>
        <div class="col-4" data-ng-bind="mobilePhone">
        </div>
    </div>
    <div class="row">
        <div class="col-1">
            {{resourceService.getString('Fax')}}
        </div>
        <div class="col-2" data-ng-bind="fax">
        </div>
        <div class="col-3">
        </div>
        <div class="col-4">
        </div>
    </div>
</div>
